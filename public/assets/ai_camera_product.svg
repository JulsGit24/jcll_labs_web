<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" style="stop-color:rgb(0,255,255);stop-opacity:0.8" />
            <stop offset="100%" style="stop-color:rgb(0,0,0);stop-opacity:0" />
        </radialGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="800" height="600" fill="#050505" />
    
    <!-- Camera Body -->
    <rect x="250" y="200" rx="20" ry="20" width="300" height="200" style="fill:#1a1a1a;stroke:#333;stroke-width:2" />
    <circle cx="400" cy="300" r="80" style="fill:#111;stroke:#00ffff;stroke-width:4;filter:url(#glow)" />
    <circle cx="400" cy="300" r="40" style="fill:#222;stroke:#ff00ff;stroke-width:2" />
    
    <!-- AI Particles -->
    <circle cx="580" cy="250" r="5" fill="#00ffff" filter="url(#glow)">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="560" cy="220" r="3" fill="#ff00ff" filter="url(#glow)">
        <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="200" cy="350" r="4" fill="#00ffff" filter="url(#glow)">
         <animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    
    <!-- Text -->
    <text x="400" y="500" font-family="Arial" font-size="24" fill="#555" text-anchor="middle" letter-spacing="4">AI-FUSION SENSOR</text>
</svg>
